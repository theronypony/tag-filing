name: Release

# Build, attest, and publish the plugin whenever a version tag is pushed.
# Obsidian's release convention is a bare semver tag (e.g. "1.0.1", no "v" prefix).
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write # create the GitHub release and upload assets
  id-token: write # required for build provenance attestations
  attestations: write # write the attestation to the attestations API

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify manifest version matches tag
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$manifest_version" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json version ($manifest_version) does not match tag (${GITHUB_REF_NAME})" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Publish release files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_name=$(node -p "require('./manifest.json').name")
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # Publishing through GitHub's UI creates the release before this job runs.
            # Keep its title/notes and attach the build; reruns replace incomplete assets.
            gh release upload "${GITHUB_REF_NAME}" \
              main.js manifest.json styles.css \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              main.js manifest.json styles.css \
              --title "${release_name} ${GITHUB_REF_NAME}" \
              --latest \
              --verify-tag \
              --generate-notes
          fi
